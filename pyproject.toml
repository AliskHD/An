[project]
name = "montblanc-tagesplan"
version = "0.1.0"
description = "Automatisierte Tagesplanung fuer die Mont Blanc Abteilung"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "msal>=1.28",
    "click>=8.1",
    "pyyaml>=6.0",
    "botbuilder-core>=4.17",
    "botbuilder-schema>=4.17",
    "botbuilder-integration-aiohttp>=4.17",
    "botframework-connector>=4.17",
    "aiohttp>=3.9",
]

[project.scripts]
montblanc = "montblanc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
